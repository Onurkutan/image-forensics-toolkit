# Dataset acquisition recipes (see imgforensics.data.acquire).
#
# Each entry's `dataset` must name an entry in `datasets.yaml`. A step's
# `url`/`repo_id`/`file_id` must either already appear in that registry
# entry's `homepage`/`download` fields, or have been independently verified
# (see each entry's note below for how). When neither was possible -- an
# unstable, per-visit signed URL, or a gated/form-only dataset -- the
# recipe uses a `manual` step instead of guessing a URL.
#
# `fetch()` never handles credentials: nothing here asks for a Kaggle
# token, a Hugging Face access token, or a login. A dataset that needs one
# only ever appears here as a `manual` step with printed instructions.

recipes:
  - dataset: "Community Forensics"
    subset_note: >-
      The registry's homepage links the main ~1 TB "Community Forensics"
      dataset (OwensLab/CommunityForensics); its own dataset card documents
      a separate, smaller repository -- OwensLab/CommunityForensics-Small,
      ~260 GB, 512x512 PNGs stored as Parquet shards under `data/*.parquet`,
      single "train" split with per-row `split`/`label`/`model_name`
      columns -- for disk-constrained setups. This recipe downloads that
      "-Small" repository (verified via its Hugging Face dataset-server
      schema on 2026-09-09: columns image_name, format, resolution, mode,
      image_data, model_name, nsfw_flag, prompt, real_source, subset,
      split, label, architecture). The default step bounds the download to the first 8 sorted `data/*.parquet` shards. Shards range from about 1 GB to 4 GB each, so expect roughly 23 GB (about 24,000 images: 9,000 512x512 fakes from 227 generators and 15,000 1024x1024 reals), not the whole ~260 GB repository, which does not
      fit this project's disk budget (see docs/ROADMAP.md); pass
      `--variant full` to download every shard instead. Materializing the
      Parquet rows into a real/fake image tree needs
      `imgforensics.data.layouts.materialize_parquet` (requires `pyarrow`,
      not an imgforensics dependency -- see its docstring for manual
      instructions when pyarrow is unavailable).
    steps:
      - method: hf
        repo_id: "OwensLab/CommunityForensics-Small"
        repo_type: "dataset"
        allow_patterns: ["data/*.parquet"]
        revision: "main"
        max_files: 8
    variants:
      full:
        - method: hf
          repo_id: "OwensLab/CommunityForensics-Small"
          repo_type: "dataset"
          allow_patterns: ["data/*.parquet"]
          revision: "main"

  - dataset: "Synthbuster"
    subset_note: >-
      Single archive covering all 9 generators' fake images only; the
      paired RAISE-1k real photos are a separate download (registry entry
      "RAISE") under RAISE's own non-commercial terms and are not part of
      this zip.
    steps:
      - method: http
        url: "https://zenodo.org/records/10066460/files/synthbuster.zip?download=1"
        filename: "synthbuster.zip"
        sha256: null
        unpack: true

  - dataset: "COCO"
    subset_note: >-
      Default step downloads only val2017.zip (~1 GB, matching the
      "val_only" variant). Use --variant train for the full training set
      (~18 GB) or --variant annotations for the instance/caption JSONs.
    steps:
      - method: http
        url: "http://images.cocodataset.org/zips/val2017.zip"
        filename: "val2017.zip"
        sha256: null
        unpack: true
    variants:
      val_only:
        - method: http
          url: "http://images.cocodataset.org/zips/val2017.zip"
          filename: "val2017.zip"
          sha256: null
          unpack: true
      train:
        - method: http
          url: "http://images.cocodataset.org/zips/train2017.zip"
          filename: "train2017.zip"
          sha256: null
          unpack: true
      annotations:
        - method: http
          url: "http://images.cocodataset.org/annotations/annotations_trainval2017.zip"
          filename: "annotations_trainval2017.zip"
          sha256: null
          unpack: true

  - dataset: "CocoGlide"
    subset_note: >-
      Downloaded from the TruFor authors' own host (grip.unina.it), which
      serves the raw images and masks as a flat zip -- not the Hugging
      Face "nebula/CocoGlide" mirror, which is Parquet-only (image/mask
      columns auto-converted for the `datasets` library, not gettable as
      individual files via huggingface_hub's allow_patterns). Verified via
      the TruFor repository README on 2026-09-09. The zip's internal
      folder layout is not documented publicly; it was read off an
      extracted copy on 2026-09-10 and is now described by the CocoGlide
      entry in layouts.yaml, whose notes also cover the one pairing step
      needed before `datasets prepare` can resolve the masks.
    steps:
      - method: http
        url: "https://www.grip.unina.it/download/prog/TruFor/CocoGlide.zip"
        filename: "CocoGlide.zip"
        sha256: null
        unpack: true

  - dataset: "CASIA v2.0"
    subset_note: >-
      A single Google Drive archive already bundles the corrected images
      (Au/ authentic, Tp/ tampered) together with the corrected
      ground-truth masks (Gt/), per the SunnyHaze/CASIA2.0-Corrected-Groundtruth
      mirror README (verified 2026-09-09; this is the same file id as the
      registry's `download` field). There is no separate GitHub-hosted zip
      to fetch over plain http, and no separate manual step is needed for
      the images -- both live in this one archive, unlike a typical
      images-plus-corrected-masks split.
    steps:
      - method: gdrive
        file_id: "1JN93ts7VxJ4bbJL9TlE9uxM3ZeYuCN9M"
        filename: "casia2_corrected.zip"
        unpack: true

  - dataset: "TGIF"
    subset_note: >-
      Hosted on an imec Nextcloud public share (cloud.ilabt.imec.be). The
      share link and its per-folder download URLs are stable -- an earlier
      note here claimed a per-visit expiring token, which is wrong; what
      is streamed rather than stored is only the zip the server builds on
      the fly, so a download cannot be resumed and has no length or
      checksum to verify against. 65.4 GB over six folders, downloaded one
      at a time; this stays a manual step because a browser handles those
      multi-hour streamed downloads far better than a fetch helper would
      (verified against the share on 2026-09-21).
    steps:
      - method: manual
        instructions: |
          TGIF is one Nextcloud public share:
          https://cloud.ilabt.imec.be/index.php/s/xEeAzrY7ES9KA8o
          (reachable from https://github.com/IDLabMedia/tgif-dataset).

          1. Download the six folders, each as its own zip, from the stable
             per-folder URL
             https://cloud.ilabt.imec.be/index.php/s/xEeAzrY7ES9KA8o/download?path=%2F&files=<folder>
             with <folder> one of (sizes as the share reports them):
               masks    40 MB    the inpainting masks, all sizes
               orig     6.8 GB   the authentic images and their two crops
               sd2-fr   7.1 GB   SD2, fully regenerated, 512x512
               sdxl-fr  17.3 GB  SDXL, fully regenerated, 1024-crop size
               sd2-sp   17.3 GB  SD2, spliced back into the full-size original
               ps-sp    16.8 GB  Photoshop/Firefly generative fill, spliced
             Fetch masks/ and orig/ first: together they are under 7 GB and
             already make a usable real-only manifest, and every fake
             subset is paired against them.
          2. Each zip contains <folder>/<folder>_training.tar.gz,
             _validation.tar.gz and _testing.tar.gz. Unzip, then untar each
             tarball so this dataset's root ends up holding
             <folder>/<split>/<COCO category>/<file>, e.g.
             orig/testing/airplane/134886_orig.png and
             masks/testing/airplane/134886_mask_bbox.png_ps_mask.png.
             The folder names are lower-case exactly as above (the project
             README's original/, SD2-sp/, ... spelling is not what the
             share serves), and the layout in layouts.yaml depends on that
             shape -- not on what the root folder itself is called, which
             is always passed explicitly.
          3. Fix one upstream packaging bug: sd2-fr_validation.tar.gz
             nests the COCO category "train" twice, so after untarring you
             have sd2-fr/validation/train/train/. Move those 168 files up
             one level (and remove the empty inner folder), so they sit at
             sd2-fr/validation/train/ like every other category. Left as
             unpacked they are still labeled and split correctly, but the
             layout gives them no mask and no `extra`, because nothing at
             that depth matches its regexes.
          4. TGIF2's FLUX and random-mask folders are a separate download
             and are not covered by this recipe or by the TGIF layout.
          5. License is CC BY-SA 4.0 (ShareAlike): any redistributed
             derivative built from these images must carry the same license.

  - dataset: "ITW-SM"
    steps:
      - method: hf
        repo_id: "dkarageo/itw-sm"
        repo_type: "dataset"
        allow_patterns: []
        revision: null

  - dataset: "WildRF"
    subset_note: >-
      Google Drive file id taken directly from the registry's `download`
      field (same URL, verified 2026-09-09).
    steps:
      - method: gdrive
        file_id: "1A0xoL44Yg68ixd-FuIJn2VC4vdZ6M2gn"
        filename: "wildrf.zip"
        unpack: true

  - dataset: "Chameleon"
    steps:
      - method: manual
        instructions: |
          Chameleon is gated behind an academic email request; there is no
          public download URL.

          1. Read https://github.com/shilinyan99/AIDE (Chameleon's parent
             repository) for the current contact address and request
             instructions.
          2. Email the authors requesting access, citing the paper
             (arXiv:2406.19435).
          3. License: "only used for academic research; commercial use in
             any form is prohibited" -- do not use for anything commercial.

  - dataset: "MIML"
    steps:
      - method: manual
        instructions: |
          MIML is licensed to full-time university/research-institute
          staff via a signed institutional application form; there is no
          public download URL.

          1. Read https://github.com/qcf-568/MIML for the current
             application form and contact details.
          2. Have your institution sign and submit the form as instructed
             there.
          3. License: non-commercial research use only.
