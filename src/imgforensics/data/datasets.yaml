    images: "filtered, JPEG-QF-aligned subset of GenImage selected via metadata.csv (e.g. 450-550px width/height, aligned compression_rate)"
    generators: "same 8 as GenImage"
    masks: false
    citation: "arXiv:2403.17608"
    notes: >-
      Not a separately-hosted smaller download: the repo provides a
      metadata.csv plus jpeg_augment.py to filter the full GenImage
      download (Google Drive, or Harvard Dataverse ~500GB) by JPEG quality
      factor, size, or content class at training time. Removes the
      compression/resolution shortcut that lets a detector learn format
      bias instead of generative artifacts. No license file is published
      for the filtering code or the resulting subset.
    verified: true
    verified_on: "2026-09-09"

