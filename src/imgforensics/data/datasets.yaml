      truth in the original release is noisy: use the corrected masks.
      Format shortcut: about 60% of tampered images are TIFF while
      authentic images are JPEG/BMP; metadata-only features reportedly
      reach about 0.92 AUC on this confound alone (arXiv:2607.06615).
      Re-encode both classes identically before training.
    verified: true
