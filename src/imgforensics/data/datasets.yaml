# Dataset registry data.
#
# Catalogue of external datasets usable for AI-generated-image detection and
# manipulation-localization work. Each entry records where to obtain a
# dataset, its license, and a best-effort `commercial_ok` flag so a
# downstream training or evaluation config can filter on it with one
# predicate.
#
# `verified: true` means someone opened a primary source for that entry (its
# project page, GitHub/Hugging Face/Zenodo listing, or official download
# page) and checked license/access/size against it on the `verified_on`
# date. `verified: false` means no primary source could be reached or
# located; treat every field on that entry -- especially `license` and
# `commercial_ok` -- as unconfirmed. `homepage` and `download` are always
# either a real URL or null, never a prose description.
#
# Third-party datasets are never redistributed by this project: this file
# only records where to obtain each one and its license.

datasets:
  - name: "Community Forensics"
    task: "detection"
    homepage: "https://jespark.net/projects/2024/community_forensics/"
    download: "https://huggingface.co/datasets/OwensLab/CommunityForensics"
    access: "open"
    license: "CC-BY-4.0, for research purposes only; per-image licenses mostly CreativeML OpenRAIL-M"
    commercial_ok: false
    approx_size_gb: 1080.0
    images: "2,760,270 images from 4,803 generator models (Systematic 1.92M / Manual 774K / Commercial 14.9K / PublicEval 51.8K)"
    generators: "4,803 community-collected latent diffusion checkpoints, mostly open-source plus some commercial APIs"
    masks: false
    citation: "arXiv:2411.04125 (Park & Owens, CVPR 2025)"
    notes: >-
      Reals are LAION 40.3%, ImageNet 40.3%, plus CelebA/COCO/FFHQ; mixed
      PNG/JPEG bytes in Parquet shards, so check the real/fake format split
      for bias before training. The Hugging Face dataset viewer notes
      downloading the full set may use up to 2.2 TB (1.1 TB data + 1.1 TB
      re-indexed Arrow files); a much smaller "-Small" subset with
      redistributable reals is also documented on the dataset card for
      disk-constrained setups.
    verified: true
    verified_on: "2026-09-09"

