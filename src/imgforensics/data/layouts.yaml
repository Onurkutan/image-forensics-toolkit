# Dataset layout adapters (see imgforensics.data.layouts).
#
# Each entry describes one downloaded dataset's on-disk folder shape so
# `prepare()` can build a manifest without a bespoke script per dataset.
# `dataset` should match a `datasets.yaml` registry name (or, for
# "Community Forensics" here, the shape produced by
# `imgforensics.data.layouts.materialize_parquet` -- see its note below).
#
# A dataset is only listed here once its folder structure was confirmed
# against a primary source (its README, dataset card, an HTTP fetch of its
# download page, or -- for CocoGlide, whose zip is documented nowhere
# reachable -- an inspection of the extracted archive itself) -- see each
# entry's `notes` for what was checked and when. Guessing globs is never
# an option: a dataset stays unlisted until its shape has been seen, and
# prepare() falls back to label_from_parent_folder meanwhile.

layouts:
  - dataset: "Synthbuster"
    real_globs: []
    fake_globs: ["synthbuster/*/*"]
    generator_from: "parent"
    split_from: "none"
    mask_template: null
    exclude_globs: []
    notes: >-
      synthbuster.zip unpacks to a single top-level folder, synthbuster/,
      holding one folder per generator (dalle2, dalle3, firefly, glide,
      midjourney-v5, stable-diffusion-1-3, stable-diffusion-1-4,
      stable-diffusion-2, stable-diffusion-xl; verified against the
      archive on 2026-09-10) with 1,000 PNGs each, so the glob reaches
      through that folder and the generator name is the parent folder.
      build_manifest's own extension filter does the file-type narrowing
      (the archive also carries a csv, a script and a few text files at the
      top level, which the glob never reaches). Real images (RAISE-1k) are a
      separate download (registry entry "RAISE") with no documented pairing
      folder -- prepare() on this root alone yields a fake-only manifest,
      which the bias audit will (correctly) flag as single-label.

  - dataset: "COCO"
    real_globs: ["val2017/**", "train2017/**"]
    fake_globs: []
    generator_from: "none"
    split_from: "top"
    split_map: { "val2017": "val", "train2017": "train" }
    mask_template: null
    exclude_globs: ["annotations/**"]
    notes: >-
      COCO is a real-image source only in this project (registry task
      "real-source"); the annotations zip (JSON, no images) is excluded
      rather than scanned. No masks.

  - dataset: "CASIA v2.0"
    real_globs: ["Au/**"]
    fake_globs: ["Tp/**"]
    generator_from: "none"
    split_from: "none"
    mask_template: "Gt/{stem}_gt.png"
    exclude_globs: ["Gt/**"]
    notes: >-
      Folder names (Au/Tp/Gt) and the "<tampered stem>_gt.png" mask
      convention verified against the corrected-groundtruth mirror READMEs
      (SunnyHaze/CASIA2.0-Corrected-Groundtruth, namtpham/casia2groundtruth)
      on 2026-09-09. The registry's format-bias warning applies here:
      about 60% of tampered images are TIFF while authentic images are
      JPEG/BMP -- re-encode both classes identically before training on
      this manifest, not just before evaluating on it.

  - dataset: "TGIF"
    real_globs: ["orig/**"]
    fake_globs: ["sd2-sp/**", "ps-sp/**", "sd2-fr/**", "sdxl-fr/**"]
    generator_from: "regex"
    generator_regex: "^(?P<gen>[^/]+)/"
    split_from: "regex"
    split_regex: "/(?P<split>training|validation|testing)/"
    split_map: { "training": "train", "validation": "val", "testing": "test" }
    mask_template: null
    mask_rules:
      - regex: '^sd2-fr/(?P<split>[^/]+)/(?P<cat>[^/]+)/(?P<id>[0-9]+)_mask_(?P<type>bbox|segm)\.png_sd2-512_[0-9]+\.png$'
        template: "masks/{split}/{cat}/{id}_mask_{type}_512.png"
      - regex: '^sdxl-fr/(?P<split>[^/]+)/(?P<cat>[^/]+)/(?P<id>[0-9]+)_mask_(?P<type>bbox|segm)\.png_sdxl-1024_[0-9]+\.png$'
        template: "masks/{split}/{cat}/{id}_mask_{type}_1024.png"
      - regex: '^sd2-sp/(?P<split>[^/]+)/(?P<cat>[^/]+)/(?P<id>[0-9]+)_mask_(?P<type>bbox|segm)\.png_ps_mask\.png_sd2_[0-9]+\.png$'
        template: "masks/{split}/{cat}/{id}_mask_{type}.png_ps_mask.png"
      - regex: '^ps-sp/(?P<split>[^/]+)/(?P<cat>[^/]+)/(?P<id>[0-9]+)_mask_(?P<type>bbox|segm)\.png_ps_[0-9]+\.png$'
        template: "masks/{split}/{cat}/{id}_mask_{type}.png_ps_mask.png"
    extra_regex: '^(?:orig/[^/]+/[^/]+/[0-9]+_(?P<variant>orig(?:_512|_1024)?)\.png|(?:sd2-fr|sdxl-fr|sd2-sp|ps-sp)/[^/]+/[^/]+/[0-9]+_mask_(?P<mask_type>bbox|segm)\.png(?:_ps_mask\.png)?_(?:sd2-512|sdxl-1024|sd2|ps)_(?P<variation>[0-9]+)\.png)$'
    exclude_globs: []
    notes: >-
      Verified against the extracted download on 2026-09-21, which is not
      what the project README spells: the six folders the imec Nextcloud
      share serves are lower-case and one of them is `orig`, not
      `original` (masks, orig, sd2-fr, sdxl-fr, sd2-sp, ps-sp), each
      holding training/validation/testing, each holding one folder per COCO
      category -- category names may contain a space ("hair drier",
      "sports ball"), which is why every regex here matches a path segment
      as [^/]+ rather than \w+. TGIF2's flux1*/masks-* folders are a
      separate download and are not covered (add them to fake_globs and a
      fifth mask rule once fetched).

      One packaging quirk, in the archive itself rather than in the
      unpacking: sd2-fr_validation.tar.gz stores the COCO category "train"
      one level too deep, as sd2-fr/validation/train/train/<file> -- the
      only directory in the whole tree deeper than
      <folder>/<split>/<category>. Those 168 files still get the right
      label, generator and split, but neither the mask rules nor
      extra_regex match a path at that depth, so they come out with
      mask_path null AND an empty extra (no mask_type, no variation);
      prepare() reports them under "matched no rule". That is deliberate:
      an optional extra path segment in the rules would hide an upstream
      bug that is better fixed by moving the folder up one level (or
      accepted, at 168 of 18,744 sd2-fr fakes).

      File naming, per id (a COCO image id): orig/ holds <id>_orig.png (the
      authentic image at its own size, e.g. 1024x768), <id>_orig_1024.png
      (the crop the 1024-px pipelines ran on, e.g. 1016x776) and
      <id>_orig_512.png (the 512x512 crop the SD2 pipelines ran on); all
      three are labeled real, and extra_regex records which one an entry is
      under extra.variant (orig / orig_512 / orig_1024), so each fake
      subset can be paired against reals at its own size instead of
      training a detector to tell 512x512 from 1024x768. masks/ holds ten
      files per id: the two inpainting masks at original size
      (<id>_mask_bbox.png, <id>_mask_segm.png, mode L), the same two with a
      soft border added (<id>_mask_<type>.png_ps_mask.png, mode RGB) which
      is what was actually fed to the spliced pipelines, the two crop-size
      copies of each (<id>_mask_<type>_512.png, <id>_mask_<type>_1024.png),
      and <id>_mask_512.png / <id>_mask_1024.png, which record where the
      crops sit inside the original and are NOT inpainting masks (nothing
      pairs with them; masks/ matches no label glob, so they never become
      entries either). Fakes are <id>_mask_<type>.png_<pipeline>_<0|1|2>
      with pipeline-specific infixes -- sd2-512, sdxl-1024, ps (Photoshop
      Firefly generative fill) and, for sd2-sp, sd2 after the bordered
      mask's own name -- 2 mask types x 3 variations x 4 pipelines = 24
      fakes per authentic image (3,124 -> 74,976).

      Ground-truth pairing (this project's decision, encoded in
      mask_rules): a fully-regenerated fake is paired with the mask at its
      own geometry -- sd2-fr with <id>_mask_<type>_512.png (512x512), sdxl-fr
      with <id>_mask_<type>_1024.png (the 1024-crop size) -- while a spliced
      fake (sd2-sp, ps-sp) is paired with the bordered
      <id>_mask_<type>.png_ps_mask.png rather than the plain
      <id>_mask_<type>.png. The bordered mask is the one the inpainting
      actually consumed, so the composited region on disk is the bordered
      shape; scoring a localizer against the unbordered mask would count
      that border, which really is manipulated pixels, as a false positive
      on every single spliced image. Authentic images get no mask by
      design (their ground truth is an empty mask).

      Mask pixel values, measured on the extracted copy on 2026-09-21 (the
      loader in imgforensics.eval.records converts to L and thresholds at
      127, so all that matters is "white = manipulated, on black"):
      134886_mask_bbox_512.png and 135673_mask_segm_512.png are mode L and
      strictly two-valued, 0 and 255 (40,150 and 4,032 white px of 262,144)
      -- no threshold ambiguity at all. 134886_mask_bbox.png_ps_mask.png
      and 135673_mask_segm.png_ps_mask.png are mode RGB with R=G=B, 12 and
      17 distinct levels, overwhelmingly 0 and 255 (743,400 black / 40,150
      white of 786,432, and 693,989 / 4,061 of 699,392): the intermediate
      levels are an anti-aliased rim about 3 px wide (2,882 and 1,342
      partial pixels) around the white core, which is pixel-for-pixel the
      plain <id>_mask_<type>.png. Thresholded at 127 the bordered mask
      grows that core by 2.4% on the bbox file (IoU 0.977 with the plain
      mask) and by 17% on the segm one (IoU 0.851), the segmentation
      contour having far more perimeter per unit area. So RGB masks need
      no special handling, and the only practical difference between the
      bordered and plain masks is that rim -- which is exactly the pixels
      the spliced pipelines repainted.

  - dataset: "ITW-SM"
    real_globs: ["0_real/**"]
    fake_globs: ["1_fake/**"]
    generator_from: "regex"
    generator_regex: "^1_fake/(?P<gen>[a-z]+)_"
    split_from: "none"
    mask_template: null
    exclude_globs: []
    notes: >-
      Verified against the gated Hugging Face repository on 2026-09-15:
      10,004 files, 0_real/ and 1_fake/, 5,000 images per class. The
      originating platform is the file-name prefix (facebook_10.jpg for a
      fake, Facebook_real_10.jpg for a real), so a fake's platform is read
      with a regex into the generator field -- the useful per-group
      breakdown for an in-the-wild set whose generators are unlisted.
      Real images never carry a generator (prepare() nulls it by design, to
      keep generator-disjoint splits meaningful), so a per-platform
      comparison of both classes is computed from the file names in the
      benchmark summary rather than from the manifest. metadata.csv (path,
      label, target, platform) carries the same information.

  - dataset: "WildRF"
    real_globs: ["**/0_real/**"]
    fake_globs: ["**/1_fake/**"]
    generator_from: "none"
    split_from: "regex"
    split_regex: "^(?P<split>train|val|test)/"
    mask_template: null
    exclude_globs: []
    notes: >-
      Folder structure (train/val flat, test split further by
      reddit/twitter/facebook) verified against the repository README on
      2026-09-09. The test split's platform subfolder is not modeled as a
      generator; the dataset's own evaluation protocol trains on one
      platform and tests on the others, which this layout does not encode
      -- filter the manifest's split/path yourself for that protocol.

  - dataset: "Community Forensics"
    real_globs: ["real/**"]
    fake_globs: ["fake/**"]
    generator_from: "grandparent"
    split_from: "parent"
    mask_template: null
    exclude_globs: []
    notes: >-
      This layout describes the OUTPUT of
      imgforensics.data.layouts.materialize_parquet(), not the raw
      Parquet shards acquire.yaml downloads (data/*.parquet has no image
      files to glob at all). materialize_parquet() writes
      <real|fake>/<generator>/<split>/<name>, matching
      generator_from="grandparent" / split_from="parent" here.

  - dataset: "CocoGlide"
    real_globs: ["real/**"]
    fake_globs: ["fake/**"]
    generator_from: "regex"
    generator_regex: "^fake/(?P<gen>glide)_inpainting_"
    split_from: "none"
    mask_template: "mask_paired/{stem}_mask.png"
    exclude_globs: ["mask/**", "mask_paired/**"]
    notes: >-
      Layout of the CocoGlide.zip served by grip.unina.it, inspected after
      extraction on 2026-09-10: three sibling folders holding 512 files
      each -- real/ (the authentic COCO val2017 256x256 crops), fake/ (the
      GLIDE-inpainted versions) and mask/ (binary masks, white = the
      inpainted region) -- plus table.csv, licenses.json and README.txt at
      the root.

      The archive names a mask after its *authentic* partner
      ("<coco class>_<image id>_mask.png") while the manipulated file is
      named "glide_inpainting_val2017_<image id>_up.png", so an image and
      its mask share only the COCO image id, never a filename stem, and
      the pairing lives in table.csv. A mask_template can substitute only
      the image's own stem, so pointing it at mask/ would attach each
      mask to the *authentic* image (whose true mask is empty) and leave
      every manipulated image without one -- exactly backwards. This entry
      therefore reads a mask_paired/ folder holding the same masks named
      after the manipulated file, which one pass over table.csv creates:

        python -c "import csv,shutil;from pathlib import Path;r=Path('data/raw/CocoGlide');o=r/'mask_paired';o.mkdir(exist_ok=True);[shutil.copyfile(r/w['mask'],o/(Path(w['fake']).stem+'_mask.png')) for w in csv.DictReader((r/'table.csv').open(encoding='utf-8'))]"

      Run that once after `datasets fetch CocoGlide`, before `datasets
      prepare CocoGlide`; it is idempotent and leaves the downloaded
      folders untouched. Without it the manifest still builds, with the
      authentic/manipulated labels intact and every mask_path null, so the
      image-level metrics are unaffected and only the pixel metrics go
      missing.

      Authentic images carry no mask by design: their ground truth is an
      empty mask, which mask_template correctly resolves to None rather
      than borrowing their partner's.
