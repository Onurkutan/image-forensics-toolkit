[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "imgforensics"
version = "0.1.0"
description = "A toolkit to detect AI-generated images, AI-inpainted regions, and classic manipulations (splicing/copy-move)."
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [
    { name = "Onur Kutan" },
]
keywords = [
    "image-forensics",
    "deepfake-detection",
    "ai-generated-images",
    "image-manipulation-detection",
    "computer-vision",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy>=1.24",
    "pillow>=10",
    "opencv-python-headless>=4.8",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.5",
    "piexif>=1.1.3",
    "PyWavelets>=1.4",
    "PyYAML>=6",
]

[project.optional-dependencies]
provenance = [
    "c2pa-python>=0.37",
]
data = [
    "huggingface_hub>=0.23",
    "gdown>=5",
    "pyarrow>=15",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.5",
    "mypy>=1.8",
    "cryptography>=41",
    # FastAPI's TestClient is httpx-backed, so the API tests need it.
    "httpx>=0.27",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]
demo = [
    # 4.44 is the floor the demo page is written against; the components it
    # uses (tuple choices on a CheckboxGroup, a Gallery of captioned images)
    # have been stable since then.
    "gradio>=4.44",
]
ml = [
    # 2.6 is the first release whose torch.serialization.safe_globals accepts
    # an explicit (callable, name) pair, which the CAT-Net checkpoint reader
    # in imgforensics.localization.catnet needs.
    "torch>=2.6",
    "torchvision>=0.17",
    "timm>=1.0",
    "safetensors>=0.4",
    # libjpeg behind a stable-ABI wheel (win_amd64, manylinux2014_x86_64,
    # both macOS architectures), which is what lets
    # imgforensics.localization._jpegcoef stop entropy-decoding in Python.
    # It sits in this extra rather than beside numpy because catnet_v2 is the
    # only caller and this extra is what makes catnet_v2 runnable at all; a
    # base install keeps the pure-Python decoder, which is also the fallback
    # wherever no wheel exists (Linux aarch64, musl).
    "jpeglib>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/Onurkutan/image-forensics-toolkit"
Issues = "https://github.com/Onurkutan/image-forensics-toolkit/issues"

[project.scripts]
imgforensics = "imgforensics.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imgforensics = ["data/*.yaml", "eval/*.yaml", "api/static/*", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["imgforensics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ml: requires the optional 'ml' extra (torch, timm); run with -m ml",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
packages = ["imgforensics"]
